name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build
        env:
          REACT_APP_HASURA_GRAPHQL_URL: ${{ secrets.REACT_APP_HASURA_GRAPHQL_URL || 'https://nutrition-app.hasura.app/v1/graphql' }}
          REACT_APP_HASURA_ADMIN_SECRET: ${{ secrets.REACT_APP_HASURA_ADMIN_SECRET || secrets.REACT_APP_HASHURA_API_KEY }}
          REACT_APP_ENABLE_LOGIN: ${{ secrets.REACT_APP_ENABLE_LOGIN || 'false' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
